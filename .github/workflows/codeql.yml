name: CodeQL

# CodeQL does real dataflow analysis, which is what catches a tainted value
# reaching a shell rather than merely matching a pattern.
#
# It is free for public repositories. On a private one it needs GitHub Advanced
# Security, which this repository does not have: the analysis runs but the
# upload fails with "code scanning is not enabled". Rather than leave a job
# permanently red — which teaches everyone to ignore red — the job is skipped
# while the repository is private, and starts working by itself the moment it
# is made public.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    # Uploading results needs code scanning, which a private repository without
    # Advanced Security cannot enable.
    if: github.event.repository.visibility == 'public'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: swift
          queries: security-extended
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
