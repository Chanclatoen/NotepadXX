name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build and test
        run: ./scripts/check.sh
      - name: Build app bundle
        run: ./scripts/make-app.sh
      - name: Verify the app launches and renders
        run: |
          ./dist/NotepadXX.app/Contents/MacOS/NotepadXX --screenshot /tmp/ui.png
          test -s /tmp/ui.png || { echo "app produced no window"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: /tmp/ui.png
