name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

# A newer push makes an older run pointless. Cancelling it matters here because
# macOS runners bill at ten times the Linux rate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 carries Xcode 26.x. An older runner resolves the SwiftLint
    # build-tool plugin (pulled in transitively by CodeEditTextView) to a
    # source build, and SwiftPM refuses: "a prebuild command cannot use
    # executables built from source".
    # Self-hosted: this repository's runner is a Mac started on demand with
    # scripts/ci-local.sh. Switch back to `macos-26` for GitHub-hosted.
    runs-on: [self-hosted, macOS, notepadxx]
    # A fork's pull request must never execute on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest Xcode
        # DEVELOPER_DIR rather than `sudo xcode-select`: a self-hosted runner has
        # no terminal to type a password into, and this selects the toolchain for
        # the job only, without changing the machine for everything else.
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$latest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Build and test
        run: ./scripts/check.sh

      - name: Build app bundle
        run: ./scripts/make-app.sh

      - name: Check the signature and the runtime it asks for
        # A build that quietly loses the hardened runtime, or gains an
        # entitlement that weakens it, should fail here rather than at
        # notarization — or worse, not at all.
        run: |
          set -euo pipefail
          APP=dist/NotepadXX.app
          codesign --verify --strict --verbose=2 "$APP"

          entitlements=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null || true)
          for risky in \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation \
            com.apple.security.cs.allow-dyld-environment-variables \
            com.apple.security.automation.apple-events; do
            if printf '%s' "$entitlements" | grep -q "$risky"; then
              if printf '%s' "$entitlements" | grep -A1 "$risky" | grep -q "<true/>"; then
                echo "::error::$risky is enabled, which weakens the hardened runtime"
                exit 1
              fi
            fi
          done
          echo "signature valid, no risk-raising entitlements enabled"

      - name: Verify the app launches and renders
        run: |
          ./dist/NotepadXX.app/Contents/MacOS/NotepadXX --screenshot /tmp/ui.png
          test -s /tmp/ui.png || { echo "app produced no window"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-screenshot
          path: /tmp/ui.png
          if-no-files-found: warn
