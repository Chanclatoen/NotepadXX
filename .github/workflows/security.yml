name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a rule or signature added upstream is noticed without a push.
    - cron: "0 6 * * 1"

# Read-only: this workflow analyses code, it never needs to change anything.
permissions:
  contents: read

# Semgrep and gitleaks run on Linux, so these are the cheap jobs; the app
# hardening check lives in CI, where the app is already built.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan
        # The custom rules in .semgrep.yml target this app's own hazards — the
        # Run menu's shell invocation, the plug-in bridge and the plug-in
        # catalogue. The audit ruleset adds the generic checks on top.
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --severity=ERROR \
            Sources/ scripts/

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads history, so a secret committed and later removed is
          # still found — which is the point, since it stays in every clone.
          fetch-depth: 0
      - name: Install gitleaks
        # Pinned by checksum. A scanner fetched without verification is a
        # supply-chain hole in the thing meant to find supply-chain holes.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan history
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
