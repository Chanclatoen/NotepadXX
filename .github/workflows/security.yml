name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a rule or signature added upstream is noticed without a push.
    - cron: "0 6 * * 1"

# Read-only: this workflow analyses code, it never needs to change anything.
permissions:
  contents: read

# Semgrep and gitleaks run on Linux, so these are the cheap jobs; the app
# hardening check lives in CI, where the app is already built.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: [self-hosted, macOS, notepadxx]
    # A fork's pull request must never execute on a self-hosted runner: the job
    # runs as this user, on this machine. Harmless while the repository is
    # private, fatal the day it is public.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tool is present
        # Installed on the runner rather than pulled per run: a self-hosted Mac
        # has no container to fetch, and this keeps the job offline-capable.
        run: |
          command -v semgrep >/dev/null || {
            echo "::error::semgrep is not installed on this runner (brew install semgrep)"
            exit 1
          }
      - name: Scan
        # The custom rules in .semgrep.yml target this app's own hazards — the
        # Run menu's shell invocation, the plug-in bridge and the plug-in
        # catalogue. The audit ruleset adds the generic checks on top.
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config p/security-audit \
            --config p/secrets \
            --error \
            --metrics=off \
            --severity=ERROR \
            Sources/ scripts/

  gitleaks:
    name: Secret scan
    runs-on: [self-hosted, macOS, notepadxx]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads history, so a secret committed and later removed is
          # still found — which is the point, since it stays in every clone.
          fetch-depth: 0
      - name: Check the tool is present
        run: |
          command -v gitleaks >/dev/null || {
            echo "::error::gitleaks is not installed on this runner (brew install gitleaks)"
            exit 1
          }
      - name: Scan history
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
